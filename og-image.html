<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>OG Image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    font-family: 'Geist', system-ui, sans-serif;
    background: #060e20;
    color: #ffffff;
    position: relative;
    overflow: hidden;
  }
  .atmosphere {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 18% 12%, #142454 0%, transparent 55%),
      radial-gradient(ellipse at 88% 32%, #1a1741 0%, transparent 50%),
      linear-gradient(180deg, #0b1326 0%, #060e20 100%);
  }
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(80px); mix-blend-mode: screen;
  }
  .orb-1 { width: 480px; height: 480px; background: #1E3A8A; top: -10%; left: -8%; opacity: .6; }
  .orb-2 { width: 380px; height: 380px; background: #7E22CE; top: 40%; right: -8%; opacity: .5; }
  .orb-3 { width: 320px; height: 320px; background: #DB2777; bottom: -10%; left: 38%; opacity: .35; }

  .grain {
    position: absolute; inset: 0;
    opacity: .08; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
  }

  .content {
    position: relative; z-index: 2;
    padding: 80px 90px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: #adc9eb;
    display: flex; align-items: center; gap: 14px;
  }
  .eyebrow .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #5dd6a4; box-shadow: 0 0 18px #5dd6a4;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400; line-height: .95;
    font-size: 124px; letter-spacing: -.04em;
    color: white;
    font-variation-settings: "opsz" 144, "SOFT" 30;
    margin-top: 28px;
  }
  h1 em {
    font-style: italic; font-weight: 300;
    color: #adc9eb;
    font-variation-settings: "opsz" 144, "SOFT" 60, "WONK" 1;
  }

  .role {
    font-family: 'Fraunces', serif;
    font-style: italic; font-weight: 300;
    font-size: 38px; line-height: 1.3; letter-spacing: -.012em;
    color: rgba(255,255,255,.92);
    margin-top: 20px;
    max-width: 920px;
    font-variation-settings: "opsz" 96, "SOFT" 50;
  }
  .role b {
    font-style: normal; font-weight: 500;
    background: linear-gradient(110deg, #fff 0%, #adc9eb 40%, #ffafd3 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    font-family: 'Fraunces', serif;
    font-variation-settings: "opsz" 96, "SOFT" 30;
  }

  .footer-row {
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .badges {
    display: flex; gap: 10px;
  }
  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 10px 18px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.05);
    color: rgba(255,255,255,.92);
    backdrop-filter: blur(20px);
  }
  .badge.gold {
    background: linear-gradient(120deg, #adc9eb, #ffafd3);
    color: #0b1326; border-color: transparent;
    font-weight: 700;
  }
  .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px; font-weight: 500;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,.7);
  }
</style>
</head>
<body>
<div class="atmosphere">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="grain"></div>

<div class="content">
  <div>
    <div class="eyebrow"><span class="dot"></span>London · Available for engagements</div>
    <h1>Fazle <em>Elahee</em></h1>
    <p class="role">Senior Full-Stack Engineer &amp; <b>AI-first developer</b></p>
  </div>

  <div class="footer-row">
    <div class="badges">
      <span class="badge">17+ years</span>
      <span class="badge">Toptal · Top 3 %</span>
      <span class="badge">Zend Certified</span>
      <span class="badge gold">AI-First</span>
    </div>
    <div class="url">fazleelahhee.github.io</div>
  </div>
</div>
</body>
</html>
